# Publish to PyPI when a GitHub release is published.
#
# Uses PyPI trusted publishing: no API token is stored anywhere. PyPI
# accepts the upload because it comes from this workflow, in this
# repository, in the `pypi` environment, as registered on pypi.org.
name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    name: Build the distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Check the version matches the release tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ls dist/elome-"$tag"-py3-none-any.whl
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/elome
    permissions:
      id-token: write          # for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
