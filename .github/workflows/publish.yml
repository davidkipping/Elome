# Publish to PyPI when a GitHub release is published.
#
# Uses PyPI trusted publishing: no API token is stored anywhere. PyPI
# accepts the upload because it comes from this workflow, in this
# repository, in the `pypi` environment, as registered on pypi.org.
# Running it by hand (workflow_dispatch) builds and checks the
# distributions without uploading them.
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build the distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Check the version matches the release tag
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ls dist/elome-"$tag"-py3-none-any.whl
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Upload to PyPI
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/elome
    permissions:
      id-token: write          # for trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  dry-run:
    name: Check the built files arrive (manual runs only)
    needs: build
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: ls -l dist/
