[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "elome"
version = "0.15.0"
description = "Elómë: analytic, differentiable transit light curves on Apple Silicon (MLX), with a batman-style frontend"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["mlx>=0.30", "numpy"]

[project.optional-dependencies]
test = ["pytest", "scipy", "batman-package", "mpmath"]
# the sampling engine (anvil, formerly applemcmc) is an optional
# integration dependency — install it separately for elome.anvil:
#   pip install git+https://github.com/davidkipping/anvil

[tool.setuptools.packages.find]
# elome, plus the deprecated `metalplanet` alias (a shim re-exporting it)
include = ["elome*", "metalplanet"]

[tool.pytest.ini_options]
markers = ["slow: long-running statistical/integration tests"]
